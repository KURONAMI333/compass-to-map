plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

repositories {
    // JourneyMap API (TeamJM 公式 maven)
    maven {
        name = "TeamJM"
        url = "https://jm.gserv.me/repository/maven-public/"
    }
    // Modrinth maven (EC / NC / FCAP / JourneyMap 本体)
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "maven.modrinth:forge-config-api-port:${fcap_version}"

    // EC / NC (compileOnly: jar に含めない)
    modCompileOnly "maven.modrinth:explorers-compass:${ec_version}"
    modCompileOnly "maven.modrinth:natures-compass:${nc_version}"

    // FCAP の transitive: UnmodifiableConfig を compileOnly で公開 (FCAP v21.4.3 同梱版 3.8.1)
    compileOnly "com.electronwill.night-config:core:3.8.1"
    runtimeOnly "com.electronwill.night-config:core:3.8.1"
    runtimeOnly "com.electronwill.night-config:toml:3.8.1"

    // JourneyMap API: waypoint 登録用 (CLIENT のみ実体動作)。loom 1.14+ で remap 可。
    modCompileOnly("info.journeymap:journeymap-api-fabric:2.0.0-1.21.4-SNAPSHOT") {
        changing = true
    }

    // ─── Dev-only (runClient テスト用、公開 jar には含まれない) ─────
    modRuntimeOnly "maven.modrinth:explorers-compass:${ec_version}"
    modRuntimeOnly "maven.modrinth:natures-compass:${nc_version}"
    modRuntimeOnly "maven.modrinth:journeymap:${jm_version}"
    // JourneyMap Fabric の実行時依存 (Common Network by mysticdrew、dev runtime のみ)
    modRuntimeOnly "maven.modrinth:common-network:X79DfYZ7"
    modRuntimeOnly("info.journeymap:journeymap-api-fabric:2.0.0-1.21.4-SNAPSHOT") {
        changing = true
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": minecraft_version,
                "loader_version": loader_version,
                "fabric_version": fabric_version,
                "mod_id": mod_id,
                "mod_name": mod_name,
                "mod_description": mod_description,
                "mod_authors": mod_authors,
                "mod_license": mod_license
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// LICENSE jar 同梱
// LICENSE は repo root にのみ置く (各 cell は独立 build なので相対参照する)
def licenseFile = file("../LICENSE")
jar {
    inputs.file(licenseFile)
    from(licenseFile) {
        rename { "${it}_${mod_id}" }
    }
}
