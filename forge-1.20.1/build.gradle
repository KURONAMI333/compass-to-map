plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'java-library'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)  // 1.20.1 = Java 17

minecraft {
    mappings channel: 'parchment', version: "${parchment_mappings_version}-${parchment_minecraft_version}"

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // dev 実行で fg.deobf 依存 (JourneyMap) の refmap を SRG→開発名へ remap させる。
            // ForgeGradle は deobf jar 内の refmap を remap しないため、これが無いと mixin 適用に失敗する。
            // dev 専用の実行設定で、published jar には影響しない。
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client { workingDirectory project.file('run') }
        server { workingDirectory project.file('run/server') }
        gameTestServer { property 'forge.enabledGameTestNamespaces', mod_id }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = "JourneyMap (TeamJM)"
        url = "https://jm.gserv.me/repository/maven-public/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
}

// dev 実行専用: libs-local の jar を ForgeGradle に SRG→開発名へ remap させる。
// fg.deobf(files(...)) は jar を remap せず素通しにする (実行時 NoSuchMethodError: Minecraft.m_91087_ / Item$Properties.m_41487_)。
// remap されるのは maven 座標の依存だけなので、同じ jar を build/dev-maven に置いて座標経由にする。
// JourneyMap 5.10.5 の mixin は @Shadow フィールドを SRG 名 (f_104888_ / f_237498_) で宣言し refmap にも載せておらず、
// remap 後も名前が変わらないため、その2つの定数だけ開発名へ書き換える。
// compileOnly と公開 jar は元の libs-local の jar のまま。
def devMavenRepo = layout.buildDirectory.dir('dev-maven').get().asFile
def stageDevJar = { String name, String libsLocalFile, Map renames = [:] ->
    def src = file("libs-local/${libsLocalFile}")
    def dst = new File(devMavenRepo, "devlocal/${name}/1/${name}-1.jar")
    if (dst.exists() && dst.lastModified() >= src.lastModified()) return
    dst.parentFile.mkdirs()
    // クラスファイルの CONSTANT_Utf8 エントリ (tag 1 + 長さ + 本体) をそのまま差し替える。定数の番号は変わらない
    def utf8 = { String s ->
        def b = s.getBytes('UTF-8')
        def o = new ByteArrayOutputStream()
        o.write(1); o.write((b.length >> 8) & 0xff); o.write(b.length & 0xff); o.write(b)
        new String(o.toByteArray(), 'ISO-8859-1')
    }
    def tmp = new File(dst.parentFile, dst.name + '.tmp')
    new java.util.zip.ZipFile(src).withCloseable { zf ->
        new java.util.zip.ZipOutputStream(tmp.newOutputStream()).withCloseable { zo ->
            zf.entries().each { e ->
                byte[] data = e.isDirectory() ? new byte[0] : zf.getInputStream(e).bytes
                (renames[e.name] ?: [:]).each { from, to ->
                    def hay = new String(data, 'ISO-8859-1')
                    def needle = utf8(from)
                    def idx = hay.indexOf(needle)
                    if (idx < 0 || hay.indexOf(needle, idx + 1) >= 0) {
                        throw new GradleException("dev jar patch: ${from} not unique in ${e.name}")
                    }
                    data = (hay.substring(0, idx) + utf8(to) + hay.substring(idx + needle.length())).getBytes('ISO-8859-1')
                }
                def ne = new java.util.zip.ZipEntry(e.name)
                ne.time = e.time
                zo.putNextEntry(ne)
                zo.write(data)
                zo.closeEntry()
            }
        }
    }
    tmp.renameTo(dst)
}
stageDevJar('journeymap', 'journeymap-1.20.1-5.10.5-forge.jar', [
    'journeymap/common/mixin/client/ClientPacketListenerMixin.class': ['f_104888_': 'minecraft'],
    'journeymap/common/mixin/client/TranslatableContentsMixin.class': ['f_237498_': 'args'],
])
stageDevJar('explorerscompass', 'ExplorersCompass-1.20.1-1.4.0-forge.jar')
stageDevJar('naturescompass', 'NaturesCompass-1.20.1-1.12.0-forge.jar')
repositories {
    maven {
        name = 'devLocalJars'
        url = devMavenRepo.toURI()
        metadataSources { artifact() }
        content { includeGroup 'devlocal' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Production (compileOnly: jar に含めない)
    // 注: Modrinth maven の 307 redirect を ForgeGradle 6 が処理できないため、
    //     libs-local/ に手動 download したファイルを fg.deobf する。
    compileOnly fg.deobf(files("libs-local/ExplorersCompass-1.20.1-1.4.0-forge.jar"))
    compileOnly fg.deobf(files("libs-local/NaturesCompass-1.20.1-1.12.0-forge.jar"))
    compileOnly fg.deobf(files("libs-local/journeymap-1.20.1-5.10.5-forge.jar"))

    // Dev-only
    runtimeOnly fg.deobf("devlocal:explorerscompass:1")  // 実行用 (dev-maven 経由で remap)
    runtimeOnly fg.deobf("devlocal:naturescompass:1")
    runtimeOnly fg.deobf("devlocal:journeymap:1")  // 実行用 (dev-maven 経由で remap + mixin 定数の開発名化)
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// LICENSE jar 同梱
// LICENSE は repo root にのみ置く (各 cell は独立 build なので相対参照する)
def licenseFile = file('../LICENSE')
def licenseRenamed = "LICENSE_${mod_id}"
tasks.named('jar', Jar).configure {
    inputs.file(licenseFile)
    from(licenseFile) { rename { licenseRenamed } }
}

// 地図名を同列に明示した正式配布JAR名。
tasks.named('jar').configure {
    archiveFileName = "compass-to-map-journeymap-${mod_version}+forge-${minecraft_version}.jar"
}
