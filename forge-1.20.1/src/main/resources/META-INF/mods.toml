# Compass to Map - Forge 1.20.1 mods.toml
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://github.com/KURONAMI333/compass-to-map"
issueTrackerURL="https://github.com/KURONAMI333/compass-to-map/issues"
description='''
Compass to Map (C2M) for Forge 1.20.1 — Auto-register found structures (Explorer's Compass) and/or biomes (Nature's Compass) as JourneyMap waypoints.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    type="required"
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="explorerscompass"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="naturescompass"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="journeymap"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="CLIENT"
