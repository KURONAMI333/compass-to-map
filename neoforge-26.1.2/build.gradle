plugins {
    id 'java-library'
    id 'maven-publish'
    // ModDevGradle 2.0.141 supports NeoForge 26.1 / MC 26.1.
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    // JourneyMap API (TeamJM 公式 maven)
    maven {
        name = "JourneyMap (TeamJM)"
        url = "https://jm.gserv.me/repository/maven-public/"
    }
    // Modrinth maven (ExplorersCompass / JourneyMap 本体 / Xaero テスト用)
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

base {
    archivesName = mod_id
}

// Minecraft 26.1 requires Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    // Parchment is deprecated for 26.1+ — Mojang ships official parameter
    // names with vanilla sources now that obfuscation has been removed.

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// ─────────────────────────────────────────────────────────────
// Dependencies
// 公開 jar には compileOnly + localRuntime のいずれもバンドルされない
// ─────────────────────────────────────────────────────────────
dependencies {
    // ─── Production (本MODが連携する API) ──────────────────────────
    // ExplorersCompass: 必須依存 (構造物 DataComponent 監視のホスト)
    compileOnly "maven.modrinth:explorers-compass:${ec_version}"

    // Nature's Compass: 任意依存 (バイオーム DataComponent 監視のホスト、v2.0+)
    compileOnly "maven.modrinth:natures-compass:${nc_version}"

    // JourneyMap API: waypoint registration (CLIENT-only effective).
    // The 26.1.x API artifact isn't published separately yet; the 1.21.11
    // NeoForge snapshot is the closest forward-compatible interface set
    // (API surface is intentionally version-stable across small MC bumps).
    compileOnly("info.journeymap:journeymap-api-neoforge:2.0.0-1.21.11-SNAPSHOT") {
        changing = true
    }

    // ─── Dev-only (runClient テスト用、公開 jar には含まれない) ─────
    // ExplorersCompass 本体
    localRuntime "maven.modrinth:explorers-compass:${ec_version}"

    // Nature's Compass 本体
    localRuntime "maven.modrinth:natures-compass:${nc_version}"

    // JourneyMap 本体
    localRuntime "maven.modrinth:journeymap:${jm_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// LICENSE jar 同梱 (MIT shall be included in all copies)
// LICENSE は repo root にのみ置く (各 cell は独立 build なので相対参照する)
def licenseFile = file('../LICENSE')
def licenseRenamed = "LICENSE_${mod_id}"
tasks.named('jar', Jar).configure {
    inputs.file(licenseFile)
    from(licenseFile) { rename { licenseRenamed } }
}
