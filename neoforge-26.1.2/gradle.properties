# Sets default memory used for gradle commands.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft 26.1.2 / NeoForge 26.1.x
# Note: Java 25 is required; Parchment is no longer needed (Mojang ships
# official parameter names with vanilla sources since 26.1).
minecraft_version=26.1.2
minecraft_version_range=[26.1.2,]
neo_version=26.1.2.36-beta
loader_version_range=[1,)

## Mod Properties
mod_id=compasstomap
mod_name=Compass to Map
mod_license=MIT
mod_version=2.1.0
mod_group_id=com.kuronami.compasstomap

## Required / Optional dependencies (26.1 NeoForge versions)
ec_version=26.1-3.3.0-neoforge
nc_version=26.1-3.3.0-neoforge
jm_version=26.1.2-6.0.0-beta.73+neoforge
